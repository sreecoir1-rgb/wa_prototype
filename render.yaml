services:
  - type: web
    name: whatsapp-broadcaster
    runtime: docker
    plan: free
    region: singapore # or frankfurt / oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # Set to your free Supabase/Neon PostgreSQL connection string
      - key: SECRET_KEY
        generateValue: true
      - key: DRY_RUN
        value: "true"
      - key: WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: APP_SECRET
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
