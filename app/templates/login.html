{% extends "base.html" %}

{% block title %}Sign In - Sree Coir Broadcaster{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 4.5rem auto 2.5rem;">
  <article class="pro-card" style="box-shadow: 0 15px 30px -5px rgba(38, 32, 27, 0.12), 0 6px 12px -3px rgba(38, 32, 27, 0.06); border-radius: 20px; border-color: var(--border-color); padding: 2.25rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="width: 58px; height: 58px; background: linear-gradient(135deg, #c26510 0%, #15803d 100%); border-radius: 16px; margin: 0 auto 1.15rem; display: flex; align-items: center; justify-content: center; font-size: 1.85rem; color: white; box-shadow: 0 8px 18px -2px rgba(194, 101, 16, 0.35);">
        🥥
      </div>
      <h3 style="margin-bottom: 0.25rem; font-weight: 800; letter-spacing: -0.02em; color: var(--coir-husk); font-size: 1.45rem;">Sree Coir Broadcaster</h3>
      <p style="color: var(--text-muted); font-size: 0.88rem; margin: 0;">Multi-Channel Coir & Agri Dispatch Portal</p>
    </div>

    <form method="post" action="/login">
      <label for="username" style="font-weight: 700; font-size: 0.85rem; color: var(--coir-husk); margin-bottom: 0.35rem; display: block;">
        Admin Username
        <input type="text" id="username" name="username" placeholder="admin" required autofocus style="border-radius: 10px; margin-top: 0.25rem; border-color: var(--border-color);">
      </label>

      <label for="password" style="font-weight: 700; font-size: 0.85rem; color: var(--coir-husk); margin-top: 1rem; margin-bottom: 0.35rem; display: block;">
        Password
        <input type="password" id="password" name="password" placeholder="••••••••" required style="border-radius: 10px; margin-top: 0.25rem; border-color: var(--border-color);">
      </label>

      <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1.75rem; font-size: 0.98rem; padding: 0.8rem;">
        Sign In to Coir Studio →
      </button>
    </form>
    
    <div style="margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border-subtle); font-size: 0.78rem; text-align: center; color: var(--text-muted);">
      Protected with encrypted session cookies & bcrypt password hashing.
    </div>
  </article>
</div>
{% endblock %}
